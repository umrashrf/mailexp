services:
  postfix:
    image: alpine:latest
    container_name: mailexp-postfix
    hostname: ${HOSTNAME:-mail.domain.com}
    environment:
      - HOSTNAME=${HOSTNAME:-mail.domain.com}
      - USERNAME=${USERNAME:-your_username}
      - PASSWORD=${PASSWORD:-your_password}
    ports:
      - "36245:36245"
    volumes:
      - ./postfix:/tmp/postfix-config:ro
      - maildata:/home/${USERNAME:-your_username}/Maildir
      - postfix-spool:/var/spool/postfix
    networks:
      - mailexp-network
    command: |
      sh -c '
        apk update &&
        apk add busybox-extras vim postfix mailutils &&
        
        # Copy custom postfix configs AFTER installation
        cp -r /tmp/postfix-config/* /etc/postfix/ &&
        awk "{gsub(/ashraf\.riamumail\.com/, \"$$HOSTNAME\"); print}" /tmp/postfix-config/main.cf > /etc/postfix/main.cf &&
        awk "{gsub(/ashraf\.riamumail\.com/, \"$$HOSTNAME\"); print}" /tmp/postfix-config/aliases > /etc/postfix/aliases &&
        
        # Create mail user
        adduser -D $$USERNAME mail &&
        echo "$$USERNAME:$$PASSWORD" | chpasswd &&
        
        # Create Maildir structure
        mkdir -p /home/$$USERNAME/Maildir/cur &&
        mkdir -p /home/$$USERNAME/Maildir/new &&
        mkdir -p /home/$$USERNAME/Maildir/tmp &&
        chown $$USERNAME:$$USERNAME -R /home/$$USERNAME/Maildir &&
        
        # Modify services file for custom SMTP port
        awk "{gsub(/smtp\t+25/, \"smtp\t\t36245\"); print}" /etc/services > /tmp/services &&
        cp /tmp/services /etc/ && rm /tmp/services &&
        
        # Initialize and start postfix
        newaliases &&
        postfix start &&
        
        # Keep container running
        tail -f /var/log/mail.log
      '
    restart: unless-stopped

  dovecot:
    image: alpine:latest
    container_name: mailexp-dovecot
    hostname: ${HOSTNAME:-mail.domain.com}
    environment:
      - HOSTNAME=${HOSTNAME:-mail.domain.com}
      - USERNAME=${USERNAME:-your_username}
      - PASSWORD=${PASSWORD:-your_password}
    ports:
      - "10143:143"   # IMAP
    volumes:
      - ./dovecot.conf:/tmp/dovecot.conf:ro
      - ./users:/tmp/users:ro
      - maildata:/home/${USERNAME:-your_username}/Maildir
    networks:
      - mailexp-network
    command: |
      sh -c '
        apk update &&
        apk add busybox-extras vim dovecot &&
        
        # Copy config files from temp location
        cp /tmp/dovecot.conf /etc/dovecot/dovecot.conf &&
        cp /tmp/users /etc/dovecot/users &&
        
        # Set proper permissions on users file
        chown root:dovecot /etc/dovecot/users &&
        chmod 640 /etc/dovecot/users &&
        
        # Create mail user
        adduser -D $$USERNAME mail &&
        echo "$$USERNAME:$$PASSWORD" | chpasswd &&
        
        # Create Maildir structure (should already exist from shared volume)
        mkdir -p /home/$$USERNAME/Maildir/cur &&
        mkdir -p /home/$$USERNAME/Maildir/new &&
        mkdir -p /home/$$USERNAME/Maildir/tmp &&
        chown $$USERNAME:$$USERNAME -R /home/$$USERNAME/Maildir &&
        
        # Create dovecot log file
        touch /var/log/dovecot.log &&
        
        # Configure dovecot to log to file
        echo "log_path = /var/log/dovecot.log" >> /etc/dovecot/dovecot.conf &&
        echo "info_log_path = /var/log/dovecot.log" >> /etc/dovecot/dovecot.conf &&
        echo "debug_log_path = /var/log/dovecot.log" >> /etc/dovecot/dovecot.conf &&
        
        # Start dovecot in background
        dovecot &&
        
        # Tail dovecot logs to stdout for docker logs
        tail -f /var/log/dovecot.log
      '
    restart: unless-stopped
    depends_on:
      - postfix

volumes:
  maildata:
    driver: local
  postfix-spool:
    driver: local

networks:
  mailexp-network:
    driver: bridge