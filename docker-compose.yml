services:
  postfix:
    image: alpine:latest
    #restart: always
    container_name: mailexp-postfix
    hostname: ${HOSTNAME:-mail.domain.com}
    environment:
      - HOSTNAME=${HOSTNAME:-mail.domain.com}
      - USERNAME=${USERNAME:-your_username}
      - PASSWORD=${PASSWORD:-your_password}
    ports:
      - "36245:36245"
    volumes:
      - ./postfix:/tmp/postfix-config:ro
      - ./certs:/etc/ssl/mail
      - maildata:/home/${USERNAME:-your_username}/Maildir
      - postfix-spool:/var/spool/postfix
    networks:
      - mailexp-network
    command: |
      sh -c '
        apk update &&
        apk add busybox-extras vim postfix mailutils openssl cyrus-sasl-login &&
        
        # Copy custom postfix configs AFTER installation
        cp -r /tmp/postfix-config/* /etc/postfix/ &&
        
        # Create mail user
        adduser -D $$USERNAME mail &&
        echo "$$USERNAME:$$PASSWORD" | chpasswd &&
        
        # Create Maildir structure
        mkdir -p /home/$$USERNAME/Maildir/cur &&
        mkdir -p /home/$$USERNAME/Maildir/new &&
        mkdir -p /home/$$USERNAME/Maildir/tmp &&
        chown $$USERNAME:$$USERNAME -R /home/$$USERNAME/Maildir &&
        
        # Generate self-signed certificate if none exists
        mkdir -p /etc/ssl/mail &&
        
        if [ ! -f /etc/ssl/mail/server.pem ]; then
          openssl req -new -x509 -nodes -days 3650 \
            -subj "/C=US/ST=None/L=None/O=Mail/CN=$$HOSTNAME" \
            -out /etc/ssl/mail/server.pem \
            -keyout /etc/ssl/mail/server.key
        fi &&
        
        chmod 600 /etc/ssl/mail/server.key &&
        
        # Configure Postfix STARTTLS
        postconf -e "myhostname=$$HOSTNAME" &&
        postconf -e "smtpd_tls_cert_file=/etc/ssl/mail/server.pem" &&
        postconf -e "smtpd_tls_key_file=/etc/ssl/mail/server.key" &&
        postconf -e "smtp_tls_security_level=encrypt" &&
        postconf -e "smtpd_tls_security_level=encrypt" &&
        postconf -e "smtpd_tls_auth_only=yes" &&
        postconf -e "smtpd_tls_loglevel=1" &&
        postconf -e "smtpd_tls_received_header=yes" &&
        postconf -e "broken_sasl_auth_clients=yes" &&
        postconf -e "smtpd_sasl_auth_enable=yes" &&
        postconf -e "smtpd_sasl_security_options=noanonymous" &&
        postconf -e "smtpd_recipient_restrictions=permit_sasl_authenticated,reject_unauth_destination" &&
        
        # Configure custom SMTP port
        postconf -M smtp/inet="smtp inet n - n - - smtpd" &&
        
        sed -i "s/^smtp.*inet.*/36245 inet n - n - - smtpd/" /etc/postfix/master.cf &&
        
        # Initialize aliases
        newaliases &&
        
        # Start postfix
        postfix start &&
        
        # Keep container running
        tail -f /var/log/mail.log
      '
    restart: unless-stopped

  dovecot:
    image: alpine:latest
    #restart: always
    container_name: mailexp-dovecot
    hostname: ${HOSTNAME:-mail.domain.com}
    environment:
      - HOSTNAME=${HOSTNAME:-mail.domain.com}
      - USERNAME=${USERNAME:-your_username}
      - PASSWORD=${PASSWORD:-your_password}
    ports:
      - "10143:143"
    volumes:
      - ./dovecot.conf:/tmp/dovecot.conf:ro
      - ./users:/tmp/users:ro
      - ./certs:/etc/ssl/mail
      - maildata:/home/${USERNAME:-your_username}/Maildir
    networks:
      - mailexp-network
    command: |
      sh -c '
        apk update &&
        apk add busybox-extras vim dovecot &&
        
        # Copy config files
        cp /tmp/dovecot.conf /etc/dovecot/dovecot.conf &&
        cp /tmp/users /etc/dovecot/users &&
        
        # Permissions
        chown root:dovecot /etc/dovecot/users &&
        chmod 640 /etc/dovecot/users &&
        
        # Create mail user
        adduser -D $$USERNAME mail &&
        echo "$$USERNAME:$$PASSWORD" | chpasswd &&
        
        # Create Maildir structure (should already exist from shared volume)
        mkdir -p /home/$$USERNAME/Maildir/cur &&
        mkdir -p /home/$$USERNAME/Maildir/new &&
        mkdir -p /home/$$USERNAME/Maildir/tmp &&
        chown $$USERNAME:$$USERNAME -R /home/$$USERNAME/Maildir &&
        
        # Enable SSL/TLS for Dovecot
        echo "ssl = yes" >> /etc/dovecot/dovecot.conf
        echo "ssl_server_cert_file = /etc/ssl/mail/server.pem" >> /etc/dovecot/dovecot.conf
        echo "ssl_server_key_file = /etc/ssl/mail/server.key" >> /etc/dovecot/dovecot.conf
        
        # Logging
        touch /var/log/dovecot.log &&
        echo "log_path = /var/log/dovecot.log" >> /etc/dovecot/dovecot.conf &&
        echo "info_log_path = /var/log/dovecot.log" >> /etc/dovecot/dovecot.conf &&
        echo "debug_log_path = /var/log/dovecot.log" >> /etc/dovecot/dovecot.conf &&
        
        # Start dovecot
        dovecot &&
        
        tail -f /var/log/dovecot.log
      '
    restart: unless-stopped
    depends_on:
      - postfix

volumes:
  maildata:
    driver: local
  postfix-spool:
    driver: local

networks:
  mailexp-network:
    driver: bridge